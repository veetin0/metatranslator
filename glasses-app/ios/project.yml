# Signer iOS app: XcodeGen is the source of truth.
#   cd glasses-app/ios && xcodegen generate
# Signer.xcodeproj is generated from this file and committed (the M0 gate needs it).
#
# Lead fills in on the Mac:
#   - DEVELOPMENT_TEAM (your paid Apple developer team id, 10 chars)
#   - PRODUCT_BUNDLE_IDENTIFIER if com.signer.glasses is taken on your team
name: Signer

options:
  bundleIdPrefix: com.signer
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # Spike: Swift 5 language mode. DAT's xcframeworks are built in Swift 6 mode and import
    # fine from Swift 5 mode; strict concurrency would cost time without moving a go/no-go.
    SWIFT_VERSION: "5.0"
    # PLACEHOLDER: the lead sets the Apple developer team id here (or in Xcode, Signing).
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  MetaWearablesDAT:
    # The repo is published as facebook/meta-wearables-dat-ios (meta/ redirects to it).
    # BirdSpotter pins the same URL with exactVersion 1.0.1.
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1

targets:
  Signer:
    type: application
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: Signer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.signer.glasses
        PRODUCT_NAME: Signer
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Signer/Info.plist
        CODE_SIGN_ENTITLEMENTS: Signer/Signer.entitlements
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATDisplay
      - package: MetaWearablesDAT
        product: MWDATMockDevice
    info:
      path: Signer/Info.plist
      properties:
        CFBundleDisplayName: Signer
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        # Meta AI app callback after registration / permission requests.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: "$(PRODUCT_BUNDLE_IDENTIFIER)"
            CFBundleURLSchemes:
              - signer
        MWDAT:
          AppLinkURLScheme: "signer://"
          # 0 = Developer Mode. Outside Developer Mode set the Wearables Developer Center ids.
          MetaAppID: "0"
          ClientToken: "0"
          TeamID: "$(DEVELOPMENT_TEAM)"
          # R3: no telemetry from the SDK.
          Analytics:
            OptOut: true
          CrashReporting:
            OptOut: true
        UIBackgroundModes:
          - bluetooth-central
          - audio
        UISupportedExternalAccessoryProtocols:
          - com.meta.ar.wearable
        NSBluetoothAlwaysUsageDescription: "Signer links with your Meta glasses over Bluetooth to read the camera and show captions."
        NSBluetoothPeripheralUsageDescription: "Signer links with your Meta glasses over Bluetooth to read the camera and show captions."
        NSLocalNetworkUsageDescription: "Signer streams the glasses camera to the Signer core on your laptop and receives captions back. Nothing leaves your local network."
        # Wi-Fi camera streaming from the glasses needs _bonjour._tcp (DAT docs, build-integration-ios).
        NSBonjourServices:
          - _bonjour._tcp
        # Mock Device Kit can use the phone camera as the fake glasses camera.
        NSCameraUsageDescription: "Signer can use the phone camera as a stand-in for the glasses camera while testing without glasses."
        # Reply by voice (M3.1): phone microphone + Apple Speech, on-device when available.
        NSMicrophoneUsageDescription: "Signer listens while you hold the reply button, so your spoken reply can appear as a caption for the person you are talking to."
        NSSpeechRecognitionUsageDescription: "Signer turns your spoken reply into text. Apple Speech runs on-device when your iPhone supports it. Signer does not store the audio."
        # ws:// to the tethered laptop (local network only).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Signer/Signer.entitlements
      properties:
        # DAT streams over Wi-Fi hosted by the glasses; the phone joins it (DAT docs).
        com.apple.developer.networking.HotspotConfiguration: true
        com.apple.developer.networking.wifi-info: true

  SignerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: SignerTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.signer.glasses.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Signer

schemes:
  Signer:
    build:
      targets:
        Signer: all
        SignerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SignerTests
